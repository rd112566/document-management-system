<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Badge with Glow -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Back Layered Page -->
  <rect x="22" y="14" width="24" height="30" rx="3" fill="#ffffff" fill-opacity="0.35" />

  <!-- Front Layered Document Page -->
  <rect x="16" y="20" width="26" height="32" rx="4" fill="url(#sheetGrad)" />

  <!-- Document Text Lines -->
  <line x1="21" y1="27" x2="33" y2="27" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" />
  <line x1="21" y1="33" x2="37" y2="33" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
  <line x1="21" y1="39" x2="35" y2="39" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  <line x1="21" y1="45" x2="29" y2="45" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- AI Sparkle Star (Top Right) -->
  <path d="M44 14 L46 20 L52 22 L46 24 L44 30 L42 24 L36 22 L42 20 Z" fill="#38bdf8" />
  <circle cx="50" cy="14" r="1.5" fill="#facc15" />
</svg>
